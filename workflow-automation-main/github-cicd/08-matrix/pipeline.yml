name: Maven exercise
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and verify
        run: sh mvnw -B -ntp clean verify
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.java }}
          path: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
      - name: Record the artifact checksum
        run: sha256sum target/contdel-app-1.0-SNAPSHOT.jar > target/application.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: application-${{ matrix.java }}
          path: |
            target/contdel-app-1.0-SNAPSHOT.jar
            target/application.sha256
          if-no-files-found: error
          retention-days: 7

.maven-verification:
  stage: verify
  timeout: 15m
  script:
    - sh mvnw -B -ntp clean verify
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/

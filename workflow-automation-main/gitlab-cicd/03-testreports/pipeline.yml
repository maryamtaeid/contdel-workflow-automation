# Assumption: a Linux Docker or Kubernetes executor accepting this image.
# Add an existing runner tag only if required by your project; do not assume "edu".
default:
  image: eclipse-temurin:17.0.20.1_1-jdk-jammy
  timeout: 15m
variables:
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
stages: [verify, package]
verify:
  stage: verify
  timeout: 15m
  script:
    - sh mvnw -B -ntp clean verify
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/site/jacoco/
      - target/surefire-reports/
      - target/failsafe-reports/
